name: TDR Hotel Availability Check

on:
  schedule:
    # 6時間ごとに実行 (UTC 0, 6, 12, 18 → JST 9, 15, 21, 3)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # 手動キック用 (Actions タブから「Run workflow」)

permissions:
  contents: read

concurrency:
  group: tdr-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # config.yaml が repo に同梱されていなければ Secrets から書き出す
      # (public repo に個人情報を載せたくない場合に使う)
      - name: Prepare config.yaml
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -f config.yaml ]; then
            echo "Using committed config.yaml"
          elif [ -n "$CONFIG_YAML" ]; then
            printf '%s\n' "$CONFIG_YAML" > config.yaml
            echo "Wrote config.yaml from CONFIG_YAML secret"
          else
            echo "::error::config.yaml が repo に無く、CONFIG_YAML secret も未設定です"
            exit 1
          fi

      - name: Run check
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: npm run check

      - name: Upload report artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: |
            reports/
            logs/
          if-no-files-found: ignore
          retention-days: 14
